<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Корпуса — Сергиево-Посадский музей-заповедник</title>
  <meta name="description" content="Корпуса Сергиево-Посадского музея-заповедника">

  <!-- Fonts -->
  <link rel="stylesheet" href="/assets/css/fonts.css">

  <!-- Tailwind 4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-white text-[#24272A]">

  <!-- GLOBAL (НЕ ТРОГАЕМ) -->
  <div data-include="/tpl/header.html"></div>
  <div data-include="/tpl/menu.html"></div>
  <div data-include="/tpl/menu-mobile.html"></div>

  <!-- ================= MAIN (КАК НА ДРУГИХ СТРАНИЦАХ) ================= -->
  <main class="max-w-[1600px] mx-auto px-4 lg:px-[60px] py-[60px] lg:py-[100px]">

    <section class="flex flex-col lg:flex-row gap-[40px] lg:gap-[145px]">

      <!-- LEFT -->
      <div class="flex-1">
        <h1 class="font-['Racama']
                   text-[48px] sm:text-[64px] lg:text-[140px]
                   leading-[0.95]
                   tracking-[-0.02em]
                   mb-[40px] lg:mb-[60px]">
          Объекты
        </h1>

        <ul id="corpsList" class="text-[20px] sm:text-[22px] lg:text-[28px]">

          <!-- 0: ИНТЕРАКТИВНАЯ КАРТА (ПОЛНОЦЕННЫЙ ПУНКТ) -->
          <li class="corp-item active" data-img="/assets/img/collection-map.png">
            <a href="/corps/map.html">
              <span class="flex-1">Интерактивная карта</span>
              <span class="arrow">→</span>
            </a>
          </li>

          <li class="corp-item" data-img="/assets/img/collection-4.png">
            <a href="/corps/main.html">
              <span class="flex-1">Главный корпус</span>
              <span class="arrow">→</span>
            </a>
          </li>

          <li class="corp-item" data-img="/assets/img/collection-3.png">
            <a href="/corps/riznitsa.html">
              <span class="flex-1">Ризница Троице-Сергиевской Лавры</span>
              <span class="arrow">→</span>
            </a>
          </li>

          <li class="corp-item" data-img="/assets/img/collection-2.png">
            <a href="/corps/konny-dvor.html">
              <span class="flex-1">Музейный комплекс «Конный двор»</span>
              <span class="arrow">→</span>
            </a>
          </li>

          <li class="corp-item" data-img="/assets/img/collection-1.png">
            <a href="/corps/local-history.html">
              <span class="flex-1">Краеведческий корпус</span>
              <span class="arrow">→</span>
            </a>
          </li>

        </ul>
      </div>

      <!-- RIGHT IMAGE (DESKTOP ONLY) -->
      <div class="shrink-0 hidden lg:block">
        <img
          id="corpImage"
          src="/assets/img/collection-map.png"
          alt="Объект музея"
          class="corp-preview-img
                 w-[420px] lg:w-[480px]
                 h-auto object-cover"
        >
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <div data-include="/tpl/footer.html"></div>

  <!-- INCLUDE -->
  <script src="/include.js"></script>

  <!-- ================= MORPH LOGIC ================= -->
  <script>
    const items = document.querySelectorAll('#corpsList .corp-item');
    const image = document.getElementById('corpImage');

    let isAnimating = false;

    // чтобы не стартовать с пустой картинки — синхронизируем с active
    const active = document.querySelector('#corpsList .corp-item.active');
    if (image && active?.dataset?.img) image.src = active.dataset.img;

    items.forEach(item => {
      item.addEventListener('pointerenter', () => {
        if (!image || isAnimating) return;

        const newSrc = item.dataset.img;
        if (!newSrc) return;

        // сравнение без includes (из-за absolute URL в image.src)
        const currentFile = image.getAttribute('src');
        if (currentFile === newSrc) return;

        isAnimating = true;

        items.forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        image.classList.add('morph-out');

        setTimeout(() => {
          image.setAttribute('src', newSrc);
          image.classList.remove('morph-out');
          image.classList.add('morph-in');

          setTimeout(() => {
            image.classList.remove('morph-in');
            isAnimating = false;
          }, 300);

        }, 220);
      });
    });
  </script>

  <!-- ================= LOCAL STYLES (SCOPED, НЕ ЛОМАЕТ ХЕДЕР) ================= -->
  <style>
    /* ВАЖНО: всё только внутри #corpsList */
    #corpsList .corp-item {
      padding: 24px 0;
      border-bottom: 1px solid #DCDEE0;
      transition: color .2s, border-color .2s;
    }

    #corpsList .corp-item a {
      display: flex;
      align-items: center;
      gap: 20px;
      text-decoration: none;
      color: inherit;
    }

    #corpsList .corp-item:hover {
      color: #C92E32;
    }

    #corpsList .corp-item.active {
      color: #C92E32;
      border-bottom: 2px solid #C92E32;
    }

    #corpsList .corp-item .arrow {
      font-size: 20px;
      transition: transform .2s ease, color .2s ease;
    }

    #corpsList .corp-item:hover .arrow {
      transform: translateX(4px);
      color: #C92E32;
    }

    #corpsList .corp-item.active .arrow {
      color: #C92E32;
    }

    /* IMAGE SHAPE */
    .corp-preview-img {
      border-radius: 9999px 9999px 0 0;
      transition: transform .3s ease, opacity .3s ease;
    }

    /* MORPH STATES */
    .morph-out {
      opacity: 0;
      transform: scale(0.96) translateY(12px);
    }

    .morph-in {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  </style>

  <!-- ALPINE (как на остальных страницах, чтобы хедер/меню работали одинаково) -->
  <script src="https://unpkg.com/alpinejs" defer></script>

</body>
</html>
