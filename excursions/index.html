<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Экскурсии — Сергиево-Посадский музей</title>

  <!-- Fonts -->
  <link rel="stylesheet" href="/assets/css/fonts.css" />

  <!-- Tailwind 4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="bg-white text-[#24272A] font-['Wix_Madefor_Display']">

  <!-- GLOBAL -->
  <div data-include="/tpl/header.html"></div>
  <div data-include="/tpl/menu.html"></div>
  <div data-include="/tpl/menu-mobile.html"></div>

  <main
    x-data="{
      corps: null,
      filters: { pushkin: false, pensioner: false, walk: false, bus: false },

      cards: [
        // 1..20 (картинки: /assets/img/excursions/1.png ... /20.png)
        { id: 1,  img: '/assets/img/excursions/1.png',  corps: 1, price: 550, pushkin: true,  pensioner: false, walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 2,  img: '/assets/img/excursions/2.png',  corps: 3, price: 550, pushkin: false, pensioner: true,  walk: false, bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 3,  img: '/assets/img/excursions/3.png',  corps: 2, price: 550, pushkin: true,  pensioner: false, walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },

        { id: 4,  img: '/assets/img/excursions/4.png',  corps: 4, price: 550, pushkin: false, pensioner: true,  walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 5,  img: '/assets/img/excursions/5.png',  corps: 2, price: 550, pushkin: true,  pensioner: false, walk: false, bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 6,  img: '/assets/img/excursions/6.png',  corps: 3, price: 550, pushkin: false, pensioner: true,  walk: true,  bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },

        { id: 7,  img: '/assets/img/excursions/7.png',  corps: 1, price: 550, pushkin: true,  pensioner: true,  walk: false, bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 8,  img: '/assets/img/excursions/8.png',  corps: 3, price: 550, pushkin: false, pensioner: false, walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 9,  img: '/assets/img/excursions/9.png',  corps: 3, price: 550, pushkin: true,  pensioner: false, walk: false, bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },

        { id: 10, img: '/assets/img/excursions/10.png', corps: 4, price: 550, pushkin: false, pensioner: true,  walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 11, img: '/assets/img/excursions/11.png', corps: 2, price: 550, pushkin: true,  pensioner: false, walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 12, img: '/assets/img/excursions/12.png', corps: 3, price: 550, pushkin: false, pensioner: false, walk: false, bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },

        { id: 13, img: '/assets/img/excursions/13.png', corps: 1, price: 550, pushkin: true,  pensioner: true,  walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 14, img: '/assets/img/excursions/14.png', corps: 2, price: 550, pushkin: false, pensioner: true,  walk: false, bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 15, img: '/assets/img/excursions/15.png', corps: 4, price: 550, pushkin: true,  pensioner: false, walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },

        { id: 16, img: '/assets/img/excursions/16.png', corps: 3, price: 550, pushkin: false, pensioner: false, walk: true,  bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 17, img: '/assets/img/excursions/17.png', corps: 1, price: 550, pushkin: true,  pensioner: true,  walk: false, bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 18, img: '/assets/img/excursions/18.png', corps: 2, price: 550, pushkin: false, pensioner: false, walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },

        { id: 19, img: '/assets/img/excursions/19.png', corps: 3, price: 550, pushkin: true,  pensioner: false, walk: false, bus: true,  title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' },
        { id: 20, img: '/assets/img/excursions/20.png', corps: 4, price: 550, pushkin: false, pensioner: true,  walk: true,  bus: false, title: 'Экскурсия по выставке «Любовью и единением спасёмся»', desc: 'Тематическая экскурсия, знакомящая с земной жизнью великого Святого и традициями его посмертного почитания.' }
      ],

      hasActiveFilters() {
        return this.corps !== null ||
          this.filters.pushkin ||
          this.filters.pensioner ||
          this.filters.walk ||
          this.filters.bus
      },

      reset() {
        this.corps = null
        this.filters.pushkin = false
        this.filters.pensioner = false
        this.filters.walk = false
        this.filters.bus = false
      },

      // фильтрация карточек (AND по включенным чекбоксам)
      cardVisible(card) {
        if (this.corps !== null && card.corps !== this.corps) return false
        if (this.filters.pushkin && !card.pushkin) return false
        if (this.filters.pensioner && !card.pensioner) return false
        if (this.filters.walk && !card.walk) return false
        if (this.filters.bus && !card.bus) return false
        return true
      },

      corpsLabel(c) {
        if (c === 1) return 'Главный корпус'
        if (c === 2) return 'Ризница Троице-Сергиевской Лавры'
        if (c === 3) return 'Музейный комплекс «Конный двор»'
        return 'Краеведческий корпус'
      },

      corpsPillClass(c) {
        if (c === 1) return 'bg-[#FBEAEA] text-[#C92E32]'
        if (c === 2) return 'bg-[#EEF0FF] text-[#7474C2]'
        if (c === 3) return 'bg-[#F7F2E9] text-[#A38641]'
        return 'bg-[#E7EFEA] text-[#3A6B4C]'
      }
    }"
    class="max-w-[1600px] mx-auto px-4 lg:px-[60px] pt-10 lg:pt-20 pb-20"
  >

    <!-- HEADER -->
    <div class="flex items-start justify-between gap-6 mb-10">
      <h1 class="font-['Racama']
                 text-[40px] sm:text-[56px] lg:text-[72px]
                 leading-[0.95] tracking-[-0.02em]">
        Экскурсии
      </h1>

      <!-- CLEAR -->
      <button
        x-show="hasActiveFilters()"
        @click="reset()"
        x-transition
        class="hidden sm:flex items-center gap-3
               border border-[#24272A]
               px-5 py-3 font-semibold"
      >
        Очистить фильтры ✕
      </button>
    </div>

    <!-- КОРПУСА -->
    <div class="mb-8 flex gap-4 overflow-x-auto sm:grid sm:grid-cols-2 lg:grid-cols-4">

      <button
        @click="corps = corps === 1 ? null : 1"
        :class="corps === 1 ? 'bg-[#F2C6C6]' : 'bg-[#FBEAEA]'"
        class="group min-w-[260px] sm:min-w-0 flex items-center gap-4 px-5 py-4 transition-colors duration-300"
      >
        <img src="/assets/img/excursions/corps-1.png" class="w-10 h-10" alt="">
        <span class="font-semibold">Главный корпус</span>
      </button>

      <button
        @click="corps = corps === 2 ? null : 2"
        :class="corps === 2 ? 'bg-[#7A7CCB] text-white' : 'bg-[#EEF0FF]'"
        class="group min-w-[260px] sm:min-w-0 flex items-center gap-4 px-5 py-4 transition-colors duration-300"
      >
        <img src="/assets/img/excursions/corps-2.png" class="w-10 h-10" alt="">
        <span class="font-semibold">Ризница Троице-Сергиевской Лавры</span>
      </button>

      <button
        @click="corps = corps === 3 ? null : 3"
        :class="corps === 3 ? 'bg-[#E7D7B8]' : 'bg-[#F7F2E9]'"
        class="group min-w-[260px] sm:min-w-0 flex items-center gap-4 px-5 py-4 transition-colors duration-300"
      >
        <img src="/assets/img/excursions/corps-3.png" class="w-10 h-10" alt="">
        <span class="font-semibold">Музейный комплекс «Конный двор»</span>
      </button>

      <button
        @click="corps = corps === 4 ? null : 4"
        :class="corps === 4 ? 'bg-[#CFE3D4]' : 'bg-[#E7EFEA]'"
        class="group min-w-[260px] sm:min-w-0 flex items-center gap-4 px-5 py-4 transition-colors duration-300"
      >
        <img src="/assets/img/excursions/corps-4.png" class="w-10 h-10" alt="">
        <span class="font-semibold">Краеведческий корпус</span>
      </button>

    </div>

    <!-- ФИЛЬТРЫ -->
    <div class="mb-10 flex gap-4 overflow-x-auto sm:flex-wrap">

      <!-- Пушкинская карта -->
      <label class="min-w-[240px] flex items-center gap-4 border border-[#DCDEE0] px-4 py-3 cursor-pointer select-none">
        <input type="checkbox" x-model="filters.pushkin" class="w-5 h-5 accent-[#24272A]">
        <span class="flex items-center justify-center h-[36px] px-4 bg-[#24272A]">
          <img src="/assets/img/pushkin-card1.png" class="h-5" alt="">
        </span>
      </label>

      <label class="min-w-[220px] flex items-center gap-3 border border-[#DCDEE0] px-5 py-4 cursor-pointer select-none">
        <input type="checkbox" x-model="filters.pensioner" class="w-5 h-5 accent-[#24272A]">
        <span class="font-semibold">Пенсионеры</span>
      </label>

      <label class="min-w-[220px] flex items-center gap-3 border border-[#DCDEE0] px-5 py-4 cursor-pointer select-none">
        <input type="checkbox" x-model="filters.walk" class="w-5 h-5 accent-[#24272A]">
        <span class="font-semibold">Пешеходная</span>
      </label>

      <label class="min-w-[220px] flex items-center gap-3 border border-[#DCDEE0] px-5 py-4 cursor-pointer select-none">
        <input type="checkbox" x-model="filters.bus" class="w-5 h-5 accent-[#24272A]">
        <span class="font-semibold">Автобусная</span>
      </label>

    </div>

    <!-- КАРТОЧКИ (20 шт + фильтрация) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">

      <template x-for="card in cards" :key="card.id">
        <a
          href="/excursions/excursions-details.html"
          x-show="cardVisible(card)"
          x-transition.opacity.duration.150ms
          class="group flex flex-col gap-4"
        >
          <img
            :src="card.img"
            alt=""
            class="w-full h-[240px] object-cover"
          >

          <div class="flex flex-col gap-3">

            <div class="font-semibold">
              <span x-text="`От ${card.price} ₽ / чел`"></span>
            </div>

            <!-- pills -->
            <div class="flex items-center gap-3 flex-wrap">
              <span
                class="px-3 py-1 rounded-full text-sm font-semibold"
                :class="corpsPillClass(card.corps)"
                x-text="corpsLabel(card.corps)"
              ></span>

              <span
                x-show="card.pushkin"
                class="inline-flex items-center justify-center h-[24px] px-3 bg-[#24272A] rounded-full"
              >
                <img src="/assets/img/pushkin-card1.png" class="h-4" alt="">
              </span>
            </div>

            <h3 class="font-semibold leading-[140%] group-hover:underline" x-text="card.title"></h3>

            <p class="text-[16px] leading-[160%] text-[#24272A]/80" x-text="card.desc"></p>
          </div>
        </a>
      </template>

    </div>

    <!-- CLEAR (mobile place if нужно — я оставил как на скрине только desktop) -->

  </main>

  <div data-include="/tpl/footer.html"></div>

  <script src="/include.js"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
</body>
</html>
