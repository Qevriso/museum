<section
  x-data="heroSlider()"
  class="relative overflow-hidden bg-[#C93635]"
>
  <div
    class="relative z-10
           max-w-[1600px] mx-auto
           px-4 lg:px-[60px]
           pt-6 lg:pt-12
           pb-12 lg:pb-16"
  >
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-stretch">

      <!-- LEFT -->
      <div class="text-white w-full flex flex-col justify-between">

        <!-- DATE -->
        <div
          class="flex items-center gap-4
                 font-['Wix Madefor Display']
                 font-semibold
                 text-[16px] leading-[160%]
                 opacity-90
                 mb-4 lg:mb-6"
        >
          <span x-text="slides[current].date.split('—')[0]"></span>
          <span class="w-10 h-px bg-white/70"></span>
          <span x-text="slides[current].date.split('—')[1]"></span>
        </div>

        <!-- TITLE -->
        <h1
          class="font-['Racama]
                 font-normal
                 tracking-[-0.02em]
                 text-[52px] leading-[1.1]
                 sm:text-[60px]
                 lg:text-[140px] lg:leading-[0.9]
                 mb-4 lg:mb-6"
        >
          <span x-text="slides[current].titleLine1"></span><br>
          <span x-text="slides[current].titleLine2"></span>
        </h1>

        <!-- SUBTITLE -->
        <p
          class="font-['Wix Madefor Display']
                 text-[20px]
                 leading-[160%]
                 max-w-[520px]
                 mb-6 lg:mb-10"
          x-text="slides[current].subtitle"
        ></p>

        <!-- BUTTONS -->
        <div class="flex flex-col lg:flex-row gap-4 mb-8 lg:mb-12">
          <a
            href="#"
            class="group inline-flex items-center justify-center gap-3
                   h-[52px] px-6
                   bg-white text-[#C92E32]
                   font-semibold
                   border border-white
                   hover:bg-transparent hover:text-white
                   transition-colors"
          >
            Купить билет
            <img
              src="/assets/svg/ticket1.svg"
              class="w-5 h-5 hero-ticket-icon"
              alt=""
            >
          </a>

          <a
            href="#"
            class="inline-flex items-center justify-center gap-3
                   h-[52px] px-6
                   border border-white
                   font-semibold
                   hover:bg-white/10
                   transition-colors"
          >
            Постоянная выставка →
          </a>
        </div>

        <!-- CONTROLS -->
        <div class="flex items-center gap-4">
          <button
            @click="prev"
            class="w-10 h-10 border border-white/70
                   flex items-center justify-center
                   hover:bg-white/10 transition"
          >←</button>

          <div class="flex gap-2">
            <template x-for="(item, index) in slides" :key="index">
              <span
                class="w-6 h-1"
                :class="current === index ? 'bg-white' : 'bg-white/40'"
              ></span>
            </template>
          </div>

          <button
            @click="next"
            class="w-10 h-10 border border-white/70
                   flex items-center justify-center
                   hover:bg-white/10 transition"
          >→</button>
        </div>

      </div>

      <!-- RIGHT IMAGE (не режем, прижимаем низ) -->
      <div class="relative hidden lg:block">
        <!-- ВАЖНО: фиксируем высоту зоны изображения, чтобы низ всегда совпадал -->
        <div class="relative w-[50vw] min-h-[520px] h-full ml-auto">
          <img
            :src="slides[current].img"
            alt=""
            class="absolute right-0 bottom-[-68px]
                   w-full h-full
                   object-contain object-bottom
                   pointer-events-none select-none"
          >
        </div>
      </div>

    </div>
  </div>

  <style>
    .hero-ticket-icon {
      filter: brightness(0) saturate(100%)
              invert(27%) sepia(89%) saturate(2480%)
              hue-rotate(343deg) brightness(92%) contrast(101%);
      transition: filter .2s ease;
    }
    .group:hover .hero-ticket-icon {
      filter: brightness(0) invert(1);
    }
  </style>
</section>
