<section class="w-full">
  <!-- FULL BLEED BACKGROUND -->
  <div class="relative overflow-hidden bg-[#62A37D] text-white">

    <!-- ПАТТЕРН -->
    <div
      aria-hidden="true"
      class="pointer-events-none absolute inset-0 flex items-center justify-center"
    >
      <img
        src="/assets/svg/patern.svg"
        alt=""
        class="
          w-[300px] h-[300px]
          sm:w-[380px] sm:h-[380px]
          lg:w-[480px] lg:h-[480px]
          opacity-[0.45]
        "
        style="transform: translateY(-10%);"
      >
    </div>

    <!-- CENTERED CONTAINER (КАК В РАССЫЛКЕ) -->
    <div class="relative z-10 max-w-[1600px] mx-auto">
      <div
        class="px-4 sm:px-6 lg:px-[60px]
               py-8 sm:py-12 lg:py-[60px]"
      >
        <div
          class="flex flex-col sm:flex-row
                 sm:items-center sm:justify-between
                 gap-6 sm:gap-8"
        >

          <!-- ЗАГОЛОВОК -->
          <h2
            class="font-[Racama] font-normal
                   text-[42px] sm:text-[72px] lg:text-[96px]
                   leading-[0.95]
                   tracking-[-0.02em]"
          >
            Купить<br>билет
          </h2>

          <!-- КНОПКА (64px — СИСТЕМА) -->
          <a
            href="#"
            class="group inline-flex items-center justify-center gap-4
                   h-[64px]
                   bg-white text-[#62A37D]
                   px-6 sm:px-10 lg:px-12
                   w-full sm:w-[240px] lg:w-[360px]
                   text-base sm:text-lg font-semibold
                   border border-white
                   transition-colors
                   hover:bg-transparent hover:text-white"
          >
            Купить билет
            <img
              src="/assets/svg/ticket.svg"
              alt=""
              class="w-6 h-6 buy-ticket-icon"
            >
          </a>

        </div>
      </div>
    </div>
  </div>

  <style>
    /* иконка билета — ЗЕЛЁНАЯ */
    .buy-ticket-icon {
      filter: brightness(0) saturate(100%)
              invert(55%) sepia(18%) saturate(747%)
              hue-rotate(92deg) brightness(92%) contrast(88%);
      transition: filter .2s ease;
    }

    /* hover — БЕЛАЯ */
    .group:hover .buy-ticket-icon {
      filter: brightness(0) invert(1);
    }
  </style>
</section>
